name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  web:
    name: Web (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run build:web

  api:
    name: API (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    env:
      # epubcheck version pin: bump both together after checking
      # https://github.com/w3c/epubcheck/releases for the new zip's checksum.
      EPUBCHECK_VERSION: "5.3.0"
      EPUBCHECK_SHA256: "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --directory services/api --extra dev
      - run: uv run --directory services/api --extra dev ruff check .
      - run: uv run --directory services/api --extra dev mypy src

      # epubcheck (the epubcheck-marked test in test_epubcheck.py) needs a
      # JVM and the real epubcheck jar; both are wired up here so the gate
      # actually runs in CI, self-skipping only for local dev runs.
      - name: Set up Java (for the epubcheck gate)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache epubcheck
        id: epubcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/epubcheck-${{ env.EPUBCHECK_VERSION }}
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}

      - name: Download + verify epubcheck
        if: steps.epubcheck-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  /tmp/epubcheck.zip" | sha256sum -c -
          rm -rf "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"
          mkdir -p "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"
          unzip -q /tmp/epubcheck.zip -d "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"

      - name: Export EPUBCHECK_JAR
        run: |
          set -euo pipefail
          jar_path="$(find "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}" -name epubcheck.jar | head -n1)"
          test -n "$jar_path"
          echo "EPUBCHECK_JAR=$jar_path" >> "$GITHUB_ENV"

      - run: uv run --directory services/api --extra dev pytest
