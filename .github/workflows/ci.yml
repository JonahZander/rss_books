name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.6
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run build:web

  api:
    name: API (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    env:
      # epubcheck version pin: bump both together after checking
      # https://github.com/w3c/epubcheck/releases for the new zip's checksum.
      EPUBCHECK_VERSION: "5.3.0"
      EPUBCHECK_SHA256: "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --directory services/api --locked --extra dev
      - run: uv run --directory services/api --locked --extra dev ruff check .
      - run: uv run --directory services/api --locked --extra dev mypy src

      # epubcheck (the epubcheck-marked test in test_epubcheck.py) needs a
      # JVM and the real epubcheck jar; both are wired up here so the gate
      # actually runs in CI, self-skipping only for local dev runs.
      - name: Set up Java (for the epubcheck gate)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache epubcheck
        id: epubcheck-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/epubcheck-${{ env.EPUBCHECK_VERSION }}
          key: epubcheck-${{ env.EPUBCHECK_VERSION }}

      - name: Download + verify epubcheck
        if: steps.epubcheck-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  /tmp/epubcheck.zip" | sha256sum -c -
          rm -rf "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"
          mkdir -p "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"
          unzip -q /tmp/epubcheck.zip -d "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}"

      - name: Export EPUBCHECK_JAR
        run: |
          set -euo pipefail
          jar_path="$(find "$HOME/.cache/epubcheck-${EPUBCHECK_VERSION}" -name epubcheck.jar | head -n1)"
          test -n "$jar_path"
          echo "EPUBCHECK_JAR=$jar_path" >> "$GITHUB_ENV"

      - run: uv run --directory services/api --locked --extra dev pytest

  container:
    name: Container (build and no-credential smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build image without publishing
        run: docker build --tag rss-books:ci .
      - name: Start without credentials
        run: docker run --detach --name rss-books-ci --publish 127.0.0.1:8765:8765 rss-books:ci
      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health | grep --quiet ok; then
              exit 0
            fi
            sleep 1
          done
          docker logs rss-books-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force rss-books-ci
