[project]
name = "rss-books-api"
version = "1.2.0"
description = "FastAPI backend for RSS Books."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn>=0.51.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "feedparser>=6.0.11,<7.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "nh3>=0.3.6,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
    "ebooklib>=0.18,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "curl-cffi>=0.7.0,<1.0.0",
    "markdown-it-py>=3.0.0,<5.0.0",
    "aiosmtplib>=5.1.1,<6.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "lxml>=5.0.0,<7.0.0",
    "cryptography>=48.0.1,<49.0.0",
    "segno>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.20.2,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.15.21,<1.0.0",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
rss_books = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "epubcheck: validates the fixture edition against the real epubcheck tool; needs EPUBCHECK_JAR + java (self-skips otherwise, see CONTRIBUTING.md)",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["feedparser", "trafilatura", "ebooklib", "ebooklib.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"
