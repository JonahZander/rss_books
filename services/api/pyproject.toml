[project]
name = "rss-kindle-api"
version = "1.1.0"
description = "FastAPI backend for the RSS Kindle Selector."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "feedparser>=6.0.11,<7.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "nh3>=0.2.18,<1.0.0",
    "pillow>=11.0.0,<13.0.0",
    "ebooklib>=0.18,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "curl-cffi>=0.7.0,<1.0.0",
    "markdown-it-py>=3.0.0,<5.0.0",
    "aiosmtplib>=3.0.0,<5.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "lxml>=5.0.0,<7.0.0",
    "cryptography>=43.0.0,<46.0.0",
    "segno>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.16.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["feedparser", "trafilatura", "ebooklib", "ebooklib.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
